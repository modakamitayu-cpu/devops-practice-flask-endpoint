apiVersion: v1
kind: Pod
metadata:
  name: oom-drill
  namespace: devops-practice
  labels:
    exercise: resources
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext: 
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
  containers:
    - name: python
      image: devops-practice:day-09
      imagePullPolicy: Never
      command: ["python", "-u", "-c"]
      args:
        - |
          import time
          print("Allocting 128 MiB with a 64 MiB limit", flush=True)
          data= bytearray(8 * 1024 * 1024)
          print("Completed successfully", flush=True)
          time.sleep(30)
      resources:
        requests:
          cpu: 100m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]               