apiVersion: v1
kind: Pod
metadata: 
  name: pending-drill
  namespace: devops-practice
  labels:
    exercise: resources
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
  containers:
    - name: python
      image: devops-practice:day09
      imagePullPolicy: Never
      command: ["python", "-u", "-c"]
      args:
        - |
          import time
          print("Schedule successfully", flush=True)
          time.sleep(600)
      resources:
        requests:
          cpu: "100m"
          memory: 32Mi
        limits:
          cpu: "200m"
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: 
          drop: [ALL]  
