apiVersion: v1
kind: ServiceAccount
metadata:
  name: devops-viewer
  namespace: devops-practice
automountServiceAccountToken: false

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workload-reader
  namespace: devops-practice
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
      - endpoints
    verbs:
      - get
      - list
      - watch
    resources:
      - pods/log
    verbs:
      - get
  
  - apiGroups:
      - apps
    resources:
      - deployments
      - replicasets
    verbs:
      - get
      - list
      - watch
  
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workload-reader-binding
  namespace: devops-practice
subjects:
   - kind: ServiceAccount
     name: devops-viewer
     namespace: devops-practice
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: workload-reader