name: Python CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-lint:
    name: Test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Run Ruff linting
        run: ruff check app.py tests/

      - name: Check Ruff formatting
        run: ruff format --check app.py tests/

      - name: Run pytest
        run: |
          python -m pytest \
            --cov=app \
            --cov-report=term-missing \
            tests/
  secret-scan:
    name: GitLeaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Check out complete Git history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}             

  image-security:
    name: Build, scan and publish container
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build container image
        run: |
          docker build \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --tag devops-practice:${{ github.sha }} \
            .

      - name: Report HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "devops-practice:${{ github.sha }}"
          format: "table"
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "0"

      - name: Block fixable CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "devops-practice:${{ github.sha }}"
          format: "table"
          vuln-type: "os,library"
          severity: "CRITICAL"
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true    
      - name: Set lowercase GHCR image name
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag image with commit SHA
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag \
            devops-practice:${{ github.sha }} \
            "${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Publish commit-tagged image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push "${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Verify published image manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker buildx imagetools inspect "${IMAGE_NAME}:${GITHUB_SHA}"                